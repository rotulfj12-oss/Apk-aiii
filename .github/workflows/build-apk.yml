
name: Build ROTUL'S AI ULTRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name capacitor.config.json -print -quit)")"
          test -f "$PROJECT_DIR/package.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies and create Android project
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTUL-S-AI-ULTRA-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
